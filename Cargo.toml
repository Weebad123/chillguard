[workspace]
resolver = "3"
members = [
    "crates/chillguard-core",
    "crates/chillguard-protocol",
    "crates/chillguard-cli",
    "crates/cells/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates.
chillguard-core = { path = "crates/chillguard-core" }
chillguard-protocol = { path = "crates/chillguard-protocol" }

# Cells are `no_std` Wasm modules, and core/protocol are linked into them, so
# every shared dependency is taken without `std` (see docs/myrmic-notes.md).
myrmic-sdk = "0.7.0"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Project standard: no unwrap()/expect()/panic!() outside tests, and none of
# the other ways to stop on purpose or to index past the end. Tests are
# exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
exit = "deny"
