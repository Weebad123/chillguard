# The workspace denies unwrap/expect/panic (see Cargo.toml); tests may use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Product names are prose, not code: keep clippy::doc_markdown from asking for
# backticks around them. ".." keeps clippy's default list.
doc-valid-idents = ["ChillGuard", "WebAssembly", ".."]
