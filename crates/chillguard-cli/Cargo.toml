[package]
name = "chillguard-cli"
description = "ChillGuard operator interface: a native command-line client that talks to the cells through the Myrmic CLI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "chillguard"
path = "src/main.rs"

[dependencies]
chillguard-core = { workspace = true }
chillguard-protocol = { workspace = true }
clap = { version = "4", features = ["derive"] }
humantime = "2"
serde = { workspace = true }
# Both features are named here so that `--json` output and float parsing are
# the same in every build, whatever other workspace members ask of serde_json:
# keys stay in declaration order, and numbers read back exactly.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = { workspace = true }

[dev-dependencies]
insta = "1"

[lints]
workspace = true
